# /etc/systemd/zram-generator.conf: compressed swap in RAM (zram0).
# The phone has 10.4 GiB and no swap; games through FEX/Proton and Steam's
# web helper (1.2 GiB) can use most of it. Half of RAM as zram, which
# typically compresses 2-3x. zstd: the production kernel builds the lz4 and
# zstd backends (from r98); an unknown name makes zram-generator fall back to
# the kernel default (lz4).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
