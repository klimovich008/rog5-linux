# /etc/systemd/zram-generator.conf: compressed swap in RAM (zram0).
# The phone has 10.4 GiB and no swap; games through FEX/Proton and Steam's
# web helper (1.2 GiB) can use most of it. Half of RAM as zram, which
# typically compresses 2-3x. lzo-rle is the only zram backend in the 7.2.7
# production kernel; switch to zstd once CONFIG_ZRAM_BACKEND_ZSTD is in.
[zram0]
zram-size = ram / 2
compression-algorithm = lzo-rle
swap-priority = 100
