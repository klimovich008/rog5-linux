# /etc/sysctl.d/60-rog5-memory.conf: swap tuning for zram (no disk swap).
# zram is cheaper than dropping page cache that must be re-read from UFS.
vm.swappiness = 100
# zram has no seek cost: swap in single pages, not clusters of 8.
vm.page-cluster = 0
# Write back in small batches: the ratio defaults let ~2 GB of dirty page
# cache pile up behind the loop-over-ext4 root, which stalls fsync() callers
# (pacman, the updater snapshot, Steam) for seconds and widens the data-loss
# window of a hard reset.
vm.dirty_background_bytes = 67108864
vm.dirty_bytes = 268435456
