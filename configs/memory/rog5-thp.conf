# /etc/tmpfiles.d/rog5-thp.conf: transparent huge pages only where asked for.
# With "always", 1.6 GiB of anonymous memory sat in 2 MiB pages (Chromium,
# Steam's web helper, GNOME Shell), which pads each process's RSS and needs
# order-9 allocations that compaction must find. madvise keeps THP for the
# programs that request it (JVMs, databases, some games).
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
