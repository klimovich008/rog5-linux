# ROG5 production: PID 1 pings softdog (loaded by rog5-platform-modules;
# systemd opens the device once it appears). softdog is watchdog1 when the
# Haven watchdog of patch 0088 registered first as watchdog0; the init then
# adds WatchdogDevice=/dev/watchdog1. A hung PID 1 or a kernel stall panics
# after 2 minutes and panic=10 reboots (the reset loses ramoops here).
[Manager]
RuntimeWatchdogSec=2min
RebootWatchdogSec=10min
