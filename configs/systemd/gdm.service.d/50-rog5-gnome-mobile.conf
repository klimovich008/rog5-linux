# GDM runs only when this boot's shell is GNOME Mobile (rog5-shell), never
# beside Phosh, and only with rog5-shell-watchdog running (armed first).
# Not enabled: rog5-shell-select starts it. Without GDM there is no
# gnome-shell unlock (it needs the gdm daemon), hence no autologin either:
# /etc/gdm/custom.conf (rog5-gnome-mobile-install) asks for the PIN at boot.
[Unit]
Requires=rog5-platform-modules.service rog5-shell-watchdog.service
After=rog5-platform-modules.service rog5-p2-ready.service rog5-shell-select.service rog5-shell-watchdog.service rog5-phosh.service rog5-gnome.service rog5-desktop-mode.service

[Service]
ExecCondition=/usr/bin/grep -qsx gnome-mobile /run/rog5-shell/effective
# mutter after phoc kept a stale plane on the panel CRTC (rog5-gnome.service)
ExecStartPre=+/usr/local/libexec/rog5-kms-reset /dev/dri/card1
