# /etc/systemd/system/rog5-early-sshd.service.d/50-oom-continue.conf
# A command run over SSH that the OOM killer ends (2026-09-30 03:15: a 12 GB
# core read into Python) made systemd stop the whole unit (OOMPolicy=stop is
# the default) and SSH was refused until it restarted. Keep sshd and the
# other sessions running.
[Service]
OOMPolicy=continue
