# rog5-shell: runs only when this boot's shell is Phosh (/run/rog5-shell/effective
# is not "gnome-mobile"; a missing file counts as Phosh, so nothing changes
# for the default setup). GNOME Mobile (gdm.service) is the other side and
# orders itself after these units (one direction only: mutual After= would
# deadlock two pending start jobs).
[Unit]
After=rog5-shell-select.service

[Service]
ExecCondition=/bin/sh -c '! /usr/bin/grep -qsx gnome-mobile /run/rog5-shell/effective'
