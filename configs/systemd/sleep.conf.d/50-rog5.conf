# ROG5 sleep modes (systemd-sleep.conf(5)).
# Only suspend: the phone has no hibernation (no resume swap), and only
# systemd-suspend.service carries the USB admission (drop-in
# systemd-suspend.service.d/50-rog5-usb.conf); hybrid sleep and
# suspend-then-hibernate run other services and repeated pre/post cycles
# that it does not cover. logind then refuses them as well.
# Suspend uses s2idle: a power-key wake from PSCI deep suspend warm-reset the
# phone (see rog5-sleep-policy). systemd-sleep writes this to
# /sys/power/mem_sleep before every suspend, so a manual `systemctl suspend`
# or a deep mode selected by another tool cannot enter deep.
[Sleep]
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
MemorySleepMode=s2idle
