# The ramdisk's rog5-tailscaled serves the USB recovery link only. With the
# side port in host mode (a hub attached) that link is down, and a 5 s retry
# restarted it 221 times in 20 minutes (2026-09-29), waking the phone every
# few seconds. The packaged tailscaled covers Wi-Fi; retry the recovery one
# once a minute. Install in /etc/systemd/system/rog5-tailscaled.service.d/.
[Service]
RestartSec=60s
