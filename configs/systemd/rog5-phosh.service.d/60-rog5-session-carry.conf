# Record the open apps and let them quit cleanly while this compositor still
# runs, so the other session (Phosh <-> GNOME desktop mode) reopens them
# (rog5-session-carry; restored by the user unit rog5-session-restore).
[Service]
# The tool bounds its own work (--timeout 6 s); timeout(1) also bounds what
# it cannot interrupt (a blocking file read, the session bus handshake), so
# the compositor never waits longer than 8 s here.
ExecStop=-/usr/bin/timeout -k 1s 7s /usr/local/bin/rog5-session-carry save --close
