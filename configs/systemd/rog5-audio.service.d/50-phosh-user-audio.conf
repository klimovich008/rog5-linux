# The Phosh session's PipeWire (user "phone") starts long before the audio
# stack (~50 s). WirePlumber then probes the card before audio-route has set
# up the MultiMedia1 backend, the PCM open fails, and only "Dummy Output" is
# left (2026-09-27). Once the route is in place, restart the user's WirePlumber
# if it runs, so it re-probes the card. It's a no-op when Denial is the shell.
[Service]
ExecStartPost=-/usr/bin/systemctl --user -M phone@ try-restart wireplumber.service
