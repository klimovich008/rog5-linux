# ROG5 virtual desktop: a headless sway session (1920x1080) that runs as the
# "phone" user independently of Phosh and of the phone screen. It is meant
# for remote use (VNC on 127.0.0.1:5901 through an SSH tunnel) and for
# automation (rog5-desktop). It shows nothing on the phone.
include /etc/rog5-desktop/sway-base.conf

output HEADLESS-1 resolution 1920x1080 scale 1 bg #202020 solid_color

# Publish the Wayland display name for rog5-desktop, then serve it over VNC.
exec sh -c 'printf %s "$WAYLAND_DISPLAY" >"$XDG_RUNTIME_DIR/rog5-desktop.display"'
exec wayvnc --socket="$XDG_RUNTIME_DIR/wayvnc-desktop.sock" 127.0.0.1 5901
