# ROG5 virtual desktop: a headless sway session (1920x1080) that runs as the
# "phone" user independently of Phosh and of the phone screen. It is meant
# for remote use (VNC on the Unix socket $XDG_RUNTIME_DIR/rog5-vnc-desktop.sock,
# reachable only by the phone user and root, through an SSH tunnel:
# ssh -N -L 5901:/run/user/1000/rog5-vnc-desktop.sock root@<phone>) and for
# automation (rog5-desktop). It shows nothing on the phone.
include /etc/rog5-desktop/sway-base.conf

output HEADLESS-1 resolution 1920x1080 scale 1 bg #202020 solid_color

# Publish the Wayland display name for rog5-desktop, then serve it over VNC.
exec sh -c 'printf %s "$WAYLAND_DISPLAY" >"$XDG_RUNTIME_DIR/rog5-desktop.display"'
# A Unix socket, not a TCP port: 127.0.0.1 admits every local account and VNC
# has no password here. umask 077 and the 0700 runtime directory keep it the
# phone user's.
exec sh -c 'umask 077 && rm -f "$XDG_RUNTIME_DIR/rog5-vnc-desktop.sock" && exec wayvnc --socket="$XDG_RUNTIME_DIR/wayvnc-desktop.sock" --unix-socket "$XDG_RUNTIME_DIR/rog5-vnc-desktop.sock"'
