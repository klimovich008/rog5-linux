# /etc/chromium-flags.conf, read by the Arch chromium launcher before
# ~/.config/chromium-flags.conf (a later --enable-features line replaces this one).
# Hardware video decoding through the Iris V4L2 decoder (H.264/HEVC), see
# docs/hardware/video.md "Applications". AcceleratedVideoDecoder is the switch
# that turns accelerated decode on for desktop Linux; without it Chromium keeps
# software decoding even though the V4L2 decoder is built in. chrome://gpu still
# reports "Video Decode: Software only" (ANGLE reports vendor 0x0000); check the
# DevTools Media panel (decoder V4L2VideoDecoder) instead.
--enable-features=V4L2VideoDecoder,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecoder
--use-gl=angle
--use-angle=gles-egl
--ignore-gpu-blocklist
