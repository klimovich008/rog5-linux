# ath11k on the ROG5 gets no board MAC from its firmware and picks a random
# one at every boot, so the phone got a new DHCP address each time
# (2026-09-29: six boots, six addresses), which is bad for a server. Let
# NetworkManager use a stable MAC per network, derived from the machine ID
# and the connection (no hardware address is stored anywhere). Install in
# /etc/NetworkManager/conf.d/.
[connection-wifi-stable-mac]
match-device=type:wifi
wifi.cloned-mac-address=stable
