# ROG5: mutter's hardware cursor on the DP pipe makes the DPU underrun on every
# frame (INTF_0 underrun IRQ +256/258 frames; 0 with software cursors,
# 2026-09-29), so the external monitor showed only the underflow colour.
# Only mutter reads this; phoc/Phosh are unaffected.
MUTTER_DEBUG_DISABLE_HW_CURSORS=1
