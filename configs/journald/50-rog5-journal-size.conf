# ROG5: the journal lives in the 16 GiB persistent overlay upper layer, and
# rog5-update snapshots the whole upper before an upgrade. 837 MB of journal
# made the snapshot space check fail (2026-09-27/28). Keep ~200 MB: several
# previous boots stay available for crash analysis (journalctl -b -1).
[Journal]
SystemMaxUse=200M
