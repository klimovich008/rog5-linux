# /etc/systemd/journald.conf.d/50-rog5-journal-size.conf
# The journal lives in the persistent overlay upper layer, which rog5-update
# copies into a snapshot before an upgrade. On the 16 GiB overlay 837 MB of
# journal made the snapshot space check fail (2026-09-27/28), so it was
# capped at 200 MB; that kept only ~23 h (the night before was gone by
# morning, 2026-09-30). The overlay is 128 GiB now (~90 GB free): 1 GB keeps
# several days, and a snapshot copy of it takes seconds.
[Journal]
SystemMaxUse=1G
