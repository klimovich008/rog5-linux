# ROG Phone 5 speakers through PipeWire (/etc/wireplumber/wireplumber.conf.d).
#
# The card has no UCM profile. ACP's only analogue path is "Headphones",
# which follows the headset jack, so the stereo profile is unavailable and the
# card would stay "off". The speakers are routed in the kernel mixer by
# rog5-audio-route (MultiMedia1 -> SENARY MI2S -> both CS35L45), so use the
# pro-audio profile: one plain node per PCM, pro-output-0 = hw:0,0, with
# software volume. ACP never touches the mixer controls in this profile.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        device.description = "Speakers"
      }
    }
  }
  {
    # MultiMedia2 (hw:0,1) is not routed to anything.
    matches = [ { node.name = "~alsa_output.platform-sound.pro-output-1" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-sound.pro-output-0" } ]
    actions = {
      update-props = {
        node.description = "Speakers"
        priority.session = 1000
        priority.driver = 1000
        # The q6asm/SENARY route is qualified with 2-channel S16_LE at
        # 48 kHz (left -> bottom amplifier, right -> top); pro-audio would
        # otherwise open all 8 channels as S24_LE, which stays silent.
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
        # Close the PCM when idle (power, and every stream is a fresh open).
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
