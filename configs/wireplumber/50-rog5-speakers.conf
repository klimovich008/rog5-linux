# ROG Phone 5 speakers through PipeWire (/etc/wireplumber/wireplumber.conf.d).
#
# The card has no UCM profile. ACP's only analogue path is "Headphones",
# which follows the headset jack, so the stereo profile is unavailable and the
# card would stay "off". The speakers are routed in the kernel mixer by
# rog5-audio-route (MultiMedia1 -> SENARY MI2S -> both CS35L45), so use the
# pro-audio profile: one plain node per PCM, pro-output-0 = hw:0,0, with
# software volume. ACP never touches the mixer controls in this profile.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-sound" } ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
        device.description = "Speakers"
      }
    }
  }
  {
    # MultiMedia2 (hw:0,1) is not routed to anything.
    matches = [ { node.name = "~alsa_output.platform-sound.pro-output-1" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-sound.pro-output-0" } ]
    actions = {
      update-props = {
        node.description = "Speakers"
        priority.session = 1000
        priority.driver = 1000
        # 2 channels at 48 kHz (left -> top amplifier, right -> bottom);
        # pro-audio would otherwise open all 8 channels. S16LE: with an
        # S24_LE front end (q6asm PCM_V2, 24 bits in a 32-bit word) the audio
        # reached the amplifiers far below full scale - the speakers were quiet
        # at every amplifier setting; the same clip over S16_LE played at full
        # strength (user A/B, 2026-09-30). The SENARY back end still runs at
        # 24 bits (0111 fixup), the ADSP converts. Revisit S24 once q6asm's
        # 24-bit front end is fixed.
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        api.alsa.period-size = 1024
        api.alsa.headroom = 1024
        # Close the PCM when idle (power, and every stream is a fresh open).
        session.suspend-timeout-seconds = 5
      }
    }
  }
  {
    # Built-in microphones (mic DTB feature): MultiMedia3 capture = hw:0,3,
    # VA_CODEC_DMA_TX_0 with DMIC0 (handset) left and DMIC2 right, routed by
    # rog5-audio-route. The back end runs 2-channel S16_LE at 48 kHz.
    matches = [ { node.name = "~alsa_input.platform-sound.pro-input-3" } ]
    actions = {
      update-props = {
        node.description = "Built-in microphones"
        node.nick = "Microphones"
        priority.session = 1000
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
        # pro-audio puts every PCM of the card in one group driven together;
        # the speakers (1024-frame periods) as followers of the mic (960)
        # xrun every cycle and capture stalled. Schedule the mic on its own.
        node.group = "rog5-microphones"
        # Closing the PCM lets the VA macro drop the LPASS votes (0083).
        session.suspend-timeout-seconds = 5
      }
    }
  }
]
