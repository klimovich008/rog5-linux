# /etc/modprobe.d/rog5-iris-vp9.conf (ROG5): VP9 hardware decoding on the
# SM8350 Iris engine (k125+: 0212 stock-sized display buffers and extradata,
# 0213 scratch release on restart). Remove this file and reboot to go back to
# software VP9. Known cost: about 1 s stall per VP9 resolution change.
options qcom_iris experimental_vp9=1 vp9_dpb_extra=1
