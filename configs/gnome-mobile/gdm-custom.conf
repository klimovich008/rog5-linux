# GDM for the ROG5 GNOME Mobile mode (rog5-gnome-mobile-install). No
# automatic or timed login: the PIN is asked at boot (rog5-shell refuses
# gnome-mobile if either is enabled). GDM runs only when /etc/rog5/shell is
# gnome-mobile (gdm.service drop-in 50-rog5-gnome-mobile.conf).
[daemon]
WaylandEnable=true
AutomaticLoginEnable=false
TimedLoginEnable=false
DefaultSession=gnome-mobile.desktop

[security]
DisallowTCP=true

[xdmcp]
Enable=false

[chooser]

[debug]
