# Not in the GNOME Mobile session or GDM's greeter: gnome-shell-mobile does
# idle blanking, locking and the power key itself (its gnome-settings-daemon
# fork drops gsd-power). Phosh and the desktop mode keep it. Decided per
# logind session (Desktop/Class), since the lingering user manager's
# environment outlives sessions.
[Service]
ExecCondition=/usr/local/sbin/rog5-shell gsd-power-allowed
