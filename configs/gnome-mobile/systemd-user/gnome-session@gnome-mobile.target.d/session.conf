# The GNOME Mobile session (gnome-session --session=gnome-mobile): GNOME's
# own services and gnome-shell(-mobile) in user mode, plus the session
# settings helper. gsd-power is skipped by its ExecCondition drop-in
# (gnome-shell-mobile's powerManager blanks, locks and handles the power key).
[Unit]
Requires=gnome-session-services.target
Requires=org.gnome.Shell@user.service
Wants=rog5-gnome-mobile-session.service
