name: Offline smoke

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: offline-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  head-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      head_sha: ${{ steps.verify-head.outputs.head_sha }}
      test_tier: ${{ steps.select-tier.outputs.test_tier }}
      qemu: ${{ steps.select-tier.outputs.qemu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact reviewed head
        id: verify-head
        shell: bash
        run: |
          expected=${{ github.event.pull_request.head.sha || github.sha }}
          actual=$(git rev-parse HEAD)
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
          echo "head_sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Select bounded test tier
        id: select-tier
        shell: bash
        run: |
          selection=$(scripts/host/select-repository-test-tier.py \
            --event '${{ github.event_name }}' \
            '${{ github.event.pull_request.base.sha || github.event.before }}' \
            '${{ github.event.pull_request.head.sha || github.sha }}')
          tier=$(sed -n 's/^tier=//p' <<<"$selection")
          qemu=$(sed -n 's/^qemu=//p' <<<"$selection")
          case $tier in active|probe|ci|nightly) ;; *) exit 1 ;; esac
          case $qemu in yes|no) ;; *) exit 1 ;; esac
          printf 'test_tier=%s\nqemu=%s\n' "$tier" "$qemu" | tee -a "$GITHUB_OUTPUT"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            rustc \
            libegl1 \
            libgles2 \
            libgl1-mesa-dri \
            clang \
            cpio \
            device-tree-compiler \
            libarchive-tools \
            libbpf1 \
            libssl-dev \
            lld \
            openssl \
            python3-pyelftools \
            qemu-user-static \
            pkg-config
      - name: Record actual runner environment
        run: scripts/host/record-ci-environment.sh build/test-reports/environment
      - name: Bootstrap pinned Android boot tools
        run: scripts/host/fetch-android-boot-tools.sh
      - name: Build canonical boot-v3 template
        if: steps.select-tier.outputs.test_tier != 'active'
        run: scripts/host/build-canonical-boot-v3-template.sh
      - name: Run hardware-free recovery core
        run: scripts/host/test-repository-linux.sh '${{ steps.select-tier.outputs.test_tier }}'
      - name: Retain JSON and JUnit results on success or failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: head-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/test-reports/
          if-no-files-found: warn


  merge-compat:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      qemu: ${{ steps.select-tier.outputs.qemu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The merge ref can be regenerated after the event, even with the
          # same parents. Test the immutable merge snapshot for this run.
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify intentional merge ref
        shell: bash
        run: |
          expected=${{ github.sha }}
          actual=$(git rev-parse HEAD)
          printf 'expected_merge=%s\nactual_merge=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Select merge-compatibility test tier
        id: select-tier
        run: |
          selection=$(scripts/host/select-repository-test-tier.py \
            --event merge \
            '${{ github.event.pull_request.base.sha }}' \
            HEAD)
          tier=$(sed -n 's/^tier=//p' <<<"$selection")
          qemu=$(sed -n 's/^qemu=//p' <<<"$selection")
          case $tier in active|probe|ci) ;; *) exit 1 ;; esac
          case $qemu in yes|no) ;; *) exit 1 ;; esac
          printf 'test_tier=%s\nqemu=%s\n' "$tier" "$qemu" | tee -a "$GITHUB_OUTPUT"
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            bubblewrap \
            rustc \
            libegl1 \
            libgles2 \
            libgl1-mesa-dri \
            clang \
            cpio \
            device-tree-compiler \
            libarchive-tools \
            libbpf1 \
            libssl-dev \
            lld \
            openssl \
            python3-pyelftools \
            qemu-user-static \
            pkg-config
      - name: Record actual runner environment
        run: scripts/host/record-ci-environment.sh build/test-reports/environment
      - name: Bootstrap pinned Android boot tools
        run: scripts/host/fetch-android-boot-tools.sh
      - name: Build canonical boot-v3 template
        if: steps.select-tier.outputs.test_tier != 'active'
        run: scripts/host/build-canonical-boot-v3-template.sh
      - name: Run merge-compatibility recovery core
        run: scripts/host/test-repository-linux.sh '${{ steps.select-tier.outputs.test_tier }}'
      - name: Retain JSON and JUnit results on success or failure
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: merge-reports-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/test-reports/
          if-no-files-found: warn


  candidate-publication:
    if: github.event_name == 'pull_request'
    needs: [head-exact, panel-driver, board-production]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.head-exact.outputs.head_sha }}
      - name: Record historical observer candidate provenance (no mobile release)
        run: |
          actual=$(git rev-parse HEAD)
          printf 'reviewed_head=%s\nvalidated_head=%s\n' \
            "${{ github.event.pull_request.head.sha }}" \
            "$actual"
          test "$actual" = "${{ needs.head-exact.outputs.head_sha }}"
          test "${{ needs.head-exact.outputs.head_sha }}" = "${{ github.event.pull_request.head.sha }}"
          candidate=$(python3 -c 'import json; print(json.load(open("manifests/power-usb-active.lock.json"))["candidate_path"])')
          expected_candidate_sha=$(python3 -c 'import json; print(json.load(open("manifests/power-usb-active.lock.json"))["candidate_sha256"])')
          candidate_sha=$(sha256sum "$candidate" | cut -d ' ' -f 1)
          test "$candidate_sha" = "$expected_candidate_sha"
          scripts/host/generate-power-usb-active.py
          {
            printf 'format=rog5-reviewed-candidate-publication-v1\n'
            printf 'head_sha=%s\n' "$actual"
            printf 'candidate=%s\n' "$candidate"
            printf 'candidate_sha256=%s\n' "$candidate_sha"
            printf 'authority=none\n'
          } > candidate-publication-checkpoint.txt
      - name: Retain historical observer provenance checkpoint
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: reviewed-candidate-${{ needs.head-exact.outputs.head_sha }}
          path: candidate-publication-checkpoint.txt
          if-no-files-found: error
          retention-days: 14

  board-production:
    runs-on: ubuntu-24.04
    # Measured cold 2-job build exceeded 38 minutes before link/schema stages.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select exact-board checks
        id: board
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          selected=no
          if [[ $EVENT == schedule || $EVENT == workflow_dispatch ]] ||
             ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            selected=yes
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if grep -Eq \
              '^(patches/linux-7\.1\.4/|configs/kernel/|dts/qcom/|scripts/host/(build-rog5-production-kernel|test-production-kernel-build|check-production-build-diagnostics|test-production-build-diagnostics)\.py$|scripts/device/(kernel-build-contract|build-display-60hz-candidate-dtb)\.|scripts/device/(test-rog5-(rpmh|touch)-binding|test-mobile-dt-composition|verify-mobile-touch-providers|verify-display-60hz-dtb-delta|verify-recovery-dtb-delta)\.py$|tools/rog5-fts3658u/.*\.yaml$|\.github/workflows/offline-smoke\.yml$)' <<<"$changed"; then
              selected=yes
            fi
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          if [[ $selected == no ]]; then
            echo 'NOT RUN exact-board build: unrelated change'
          fi
      - name: Install bounded exact-board dependencies
        if: steps.board.outputs.selected == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential bc bison flex clang lld llvm libssl-dev libelf-dev \
            kmod device-tree-compiler python3-venv python3-dev libfdt-dev swig
          python3 -m venv build/schema-tools
          build/schema-tools/bin/pip install dtschema==2026.6
          build/schema-tools/bin/pip freeze > build/schema-tool-versions.txt
          echo "$PWD/build/schema-tools/bin" >> "$GITHUB_PATH"
      - name: Record board runner environment
        if: steps.board.outputs.selected == 'yes'
        run: scripts/host/record-ci-environment.sh build/board-environment
      - name: Fetch exact production kernel base
        if: steps.board.outputs.selected == 'yes'
        run: |
          mkdir -p build/board-linux-source
          git -C build/board-linux-source init
          git -C build/board-linux-source fetch --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            refs/tags/v7.1.4
          test "$(git -C build/board-linux-source rev-parse FETCH_HEAD^{commit})" = \
            7a5cef0db4795d9d453a12e0f61b5b7634fc4d40
      - name: Compile production series with merged board configuration
        if: steps.board.outputs.selected == 'yes'
        run: |
          scripts/host/build-rog5-production-kernel.py \
            --linux-git build/board-linux-source --output build/board-production --jobs 2
      - name: Exercise exact-source board schema and RPMh lifecycle checks
        if: steps.board.outputs.selected == 'yes'
        run: |
          ROG5_LINUX_SOURCE="$PWD/build/board-production/source" \
          ROG5_TEST_REPORT_DIR="$PWD/build/board-regressions" \
            scripts/host/test-repository-linux.sh board
      - name: Retain exact-board results and validation logs
        if: steps.board.outputs.selected == 'yes' && always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: board-production-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/board-production/*.json
            build/board-production/*.log
            build/board-production/dt-composition/
            build/schema-tool-versions.txt
            build/board-environment/
            build/board-regressions/
          if-no-files-found: error

  panel-driver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Select affected panel checks
        id: panel
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          selected=no
          if [[ $EVENT == schedule || $EVENT == workflow_dispatch ]] ||
             ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            selected=yes
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if grep -Eq \
              '^(patches/linux-7\.1\.4/0037-|scripts/device/(test-ams678[^/]*|fixtures/(ams678(-regulator)?|fts3658u-regulator)/)|scripts/host/(build-ams678-panel-check\.sh|test-ams678-compile-location\.py)$|\.github/workflows/offline-smoke\.yml$)' <<<"$changed"; then
              selected=yes
            fi
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          if [[ $selected == no ]]; then
            echo 'NOT RUN panel application/compile: unrelated change'
          fi
      - name: Install affected-driver dependencies
        if: steps.panel.outputs.selected == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential bc bison flex clang lld llvm libssl-dev libelf-dev
      - name: Record panel runner environment
        if: steps.panel.outputs.selected == 'yes'
        run: scripts/host/record-ci-environment.sh build/panel-environment
      - name: Fetch exact panel base
        if: steps.panel.outputs.selected == 'yes'
        run: |
          mkdir -p build/panel-linux-source
          git -C build/panel-linux-source init
          git -C build/panel-linux-source fetch --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            refs/tags/v7.1.4
          test "$(git -C build/panel-linux-source rev-parse FETCH_HEAD^{commit})" = \
            7a5cef0db4795d9d453a12e0f61b5b7634fc4d40
      - name: Apply exact base and compile affected ARM64 driver
        if: steps.panel.outputs.selected == 'yes'
        run: |
          scripts/host/build-ams678-panel-check.sh \
            build/panel-linux-source build/panel-driver-check
      - name: Retain panel source/config/object identities
        if: steps.panel.outputs.selected == 'yes' && success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: panel-driver-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/panel-driver-check/identity.txt
            build/panel-environment/
          if-no-files-found: error

  qemu-system:
    needs: [head-exact, merge-compat]
    # Explicit status handling allows main/manual/scheduled runs when the
    # PR-only merge job is skipped, but never runs after failed validation.
    if: >-
      !cancelled() && needs.head-exact.result == 'success' &&
      (needs.merge-compat.result == 'success' || needs.merge-compat.result == 'skipped') &&
      (needs.head-exact.outputs.qemu == 'yes' || needs.merge-compat.outputs.qemu == 'yes')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned ARM64 kernel
        id: qemu-kernel-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/qemu-smoke-kernel/arch/arm64/boot/Image
          key: qemu-linux-arm64-v7.1.4-7a5cef0-${{ runner.os }}-${{ hashFiles('scripts/host/build-qemu-smoke-kernel.sh', 'scripts/device/kernel-build-contract.sh') }}
      - name: Install full-system smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc \
            bison \
            build-essential \
            clang \
            cpio \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            iproute2 \
            libelf-dev \
            libc6-dev-arm64-cross \
            libssl-dev \
            lld \
            llvm \
            nfs-ganesha \
            nfs-ganesha-vfs \
            qemu-system-arm
      - name: Record QEMU runner environment
        run: scripts/host/record-ci-environment.sh build/qemu-environment
      - name: Retain QEMU environment receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: qemu-environment-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/qemu-environment/
          if-no-files-found: warn
      - name: Fetch pinned upstream Linux source
        if: steps.qemu-kernel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/qemu-linux-source
          git -C build/qemu-linux-source init
          git -C build/qemu-linux-source fetch --depth=1 \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            refs/tags/v7.1.4
          git -C build/qemu-linux-source checkout --detach FETCH_HEAD
          test "$(git -C build/qemu-linux-source rev-parse HEAD)" = \
            7a5cef0db4795d9d453a12e0f61b5b7634fc4d40
      - name: Build ARM64 virt kernel
        if: steps.qemu-kernel-cache.outputs.cache-hit != 'true'
        run: |
          scripts/host/build-qemu-smoke-kernel.sh \
            build/qemu-linux-source \
            build/qemu-smoke-kernel
      - name: Save pinned ARM64 kernel after build
        if: steps.qemu-kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/qemu-smoke-kernel/arch/arm64/boot/Image
          key: qemu-linux-arm64-v7.1.4-7a5cef0-${{ runner.os }}-${{ hashFiles('scripts/host/build-qemu-smoke-kernel.sh', 'scripts/device/kernel-build-contract.sh') }}
      - name: Isolate TCP 2049 from the package service
        run: |
          sudo systemctl stop nfs-ganesha.service
          if ss -H -ltn 'sport = :2049' | grep -q .; then
            echo 'FAIL TCP port 2049 remains occupied after stopping the package service' >&2
            exit 1
          fi
      - name: Boot kernel and initramfs under QEMU
        run: |
          scripts/host/test-qemu-system-smoke.sh \
            build/qemu-smoke-kernel/arch/arm64/boot/Image
          scripts/host/test-qemu-diagnostic-handoff.sh \
            build/qemu-smoke-kernel/arch/arm64/boot/Image
          sudo scripts/host/test-qemu-network-root-nfs.sh \
            build/qemu-smoke-kernel/arch/arm64/boot/Image
