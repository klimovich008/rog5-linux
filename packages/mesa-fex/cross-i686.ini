# i686 cross file, as FEX-Emu's RootFS Scripts/Arch/cross_x86 (clang -m32 with
# SSE2 math, the way the guest's lib32 Mesa was built), minus rust/llvm-config.
[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = '/usr/bin/i686-pc-linux-gnu-pkg-config'

[built-in options]
c_args = ['-m32', '-mfpmath=sse', '-msse', '-msse2', '-mstackrealign']
c_link_args = ['-m32', '-mfpmath=sse', '-msse', '-msse2', '-mstackrealign']
cpp_args = ['-m32', '-mfpmath=sse', '-msse', '-msse2', '-mstackrealign']
cpp_link_args = ['-m32', '-mfpmath=sse', '-msse', '-msse2', '-mstackrealign']

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
